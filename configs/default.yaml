model:
  name: "gpt2"
  max_length: 512
  temperature: 1.0
  top_k: 50
  top_p: 0.95
  repetition_penalty: 1.0
  no_repeat_ngram_size: 2
  do_sample: true

data:
  data_path: null
  max_length: 512
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  batch_size: 8
  num_workers: 4

training:
  learning_rate: 5e-5
  num_epochs: 3
  warmup_steps: 100
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  save_steps: 500
  eval_steps: 500
  logging_steps: 100
  output_dir: "./outputs"
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

evaluation:
  num_samples: 100
  metrics:
    - "perplexity"
    - "bleu"
    - "rouge"
    - "bert_score"
    - "diversity"
    - "coherence"
  batch_size: 8

generation:
  max_length: 200
  temperature: 1.0
  top_k: 50
  top_p: 0.95
  repetition_penalty: 1.0
  no_repeat_ngram_size: 2
  num_return_sequences: 1
  do_sample: true

system:
  seed: 42
  device: null
  mixed_precision: false
  num_gpus: 1
  log_level: "INFO"
